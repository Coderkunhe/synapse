name: CI

# P100-B106 (㉖): 测试/生产一致性 — CI 双矩阵（SQLite + PostgreSQL）
# 首次引入 GitHub Actions。验证代码在 SQLite 和 PostgreSQL 上均通过测试。
# PostgreSQL service container 提供生产级数据库环境。

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:  # 手动触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} · ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
        db: [sqlite, postgres]

    env:
      JWT_SECRET: ci-test-secret-not-for-production-use
      RATE_LIMIT_ENABLED: 'false'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse_test
          POSTGRES_DB: synapse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: synapse
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # PostgreSQL async driver
          pip install asyncpg

      - name: Configure database URL
        working-directory: synapse
        run: |
          if [ "${{ matrix.db }}" = "postgres" ]; then
            echo "DATABASE_URL=postgresql+asyncpg://synapse:synapse_test@localhost:5432/synapse_test" >> .env
          else
            echo "DATABASE_URL=sqlite+aiosqlite:///./data/synapse.db" >> .env
          fi

      - name: Run migrations (PostgreSQL only)
        if: matrix.db == 'postgres'
        working-directory: synapse
        run: |
          python -m alembic upgrade head

      - name: Run tests
        working-directory: synapse
        run: |
          python -m pytest -v --tb=short

      - name: Run alembic check (schema-model consistency)
        if: matrix.db == 'postgres'
        working-directory: synapse
        run: |
          python -m alembic check
