[mypy]
# Synapse mypy configuration — V-004 防呆（改代码不跑校验）
# 初始策略：渐进式 typing，先覆盖 src/，逐步收紧
# 2026-07-06: P100-B20 — 首部署 lenient 模式

# ── 路径 ──────────────────────────────────────
files = src/
exclude = (?x)(
  ^src/__pycache__/
)

# ── 导入处理 ──────────────────────────────────
ignore_missing_imports = True
follow_imports = silent

# ── 严格度（渐进收紧路线图）─────────────────
# P100-B20 (当前): 只检查有类型注解的函数
# P100-B21+ (后续): 逐步开启 disallow_untyped_defs
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
warn_return_any = False
warn_unused_ignores = False

# ── 平台 ──────────────────────────────────────
python_version = 3.12
platform = darwin

# ── 输出 ──────────────────────────────────────
show_error_codes = True
show_column_numbers = True
pretty = True
